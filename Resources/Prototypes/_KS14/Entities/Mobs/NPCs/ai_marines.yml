# USCM ranged combatant AI.  These are real marine humanoids equipped through
# USCM starting-gear prototypes, rather than Syndicate player mob wrappers.
- type: startingGear
  parent: CMGearRiflemanEquipped
  id: KsGearAiUSCMRifleman
  equipment:
    belt: RMCBeltMarineMK2
  inhand:
  - RMCWeaponRifleM54CFilled

- type: startingGear
  parent: CMGearHospitalCorpsmanEquipped
  id: KsGearAiUSCMCorpsman
  equipment:
    belt: RMCBeltMarineMK2
  inhand:
  - RMCWeaponRifleM54CFilled

- type: startingGear
  parent: CMGearSmartGunOperatorEquipped
  id: KsGearAiUSCMSmartGunner
  equipment:
    belt: RMCBeltSmartGunOperatorPistolFilled
  inhand:
  - RMCSmartGun

- type: entity
  parent: MobHuman
  id: KsAiMarineRifleman
  name: USCM AI rifleman
  components:
  - type: NpcSensors
  - type: NPCRetaliation
    attackMemoryLength: 30
  - type: Loadout
    prototypes: [ KsGearAiUSCMRifleman ]
  - type: FieldCommandable
  - type: HTN
    rootTask:
      task: KsMarineCommandableCompound
    blackboard:
      ReloadActDelay: !type:Single 0
      VisionRadius: !type:Single 17.5
      AggroVisionRadius: !type:Single 25
      CampingRange: !type:Single 0.5
      CampingTime: !type:Single 25
      AdvanceTime: !type:Single 30
      IdleActTime: !type:Single 1
      NavInteract: !type:Bool true
      NavPry: !type:Bool false
      RangedInaccuracy: !type:Single 0.35
  - type: NpcFactionMember
    factions:
    - NanoTrasen

