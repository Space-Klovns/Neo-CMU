# AI overlays for every standard xenomorph caste. The source caste keeps its
# abilities and visuals; this layer supplies HTN planning and commander selection.
- type: entity
  parent: CMXenoLarva
  id: KsAiXenoLarva
  components: &ks_ai_xeno
  - type: FieldCommandable
  - type: NpcSensors
  - type: HTN
    rootTask:
      task: KsAlienCommandableCompound

